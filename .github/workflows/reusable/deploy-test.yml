# Reusable Deploy to Test Workflow
# Called by project repos to deploy ION components to TEST environment

name: Reusable Deploy to Test

on:
  workflow_call:
    inputs:
      components-path:
        description: 'Path to ion-components directory'
        required: false
        type: string
        default: 'ion-components'
      component-types:
        description: 'Comma-separated component types to deploy (or empty for changed only)'
        required: false
        type: string
        default: ''
      auto-approve-scripts:
        description: 'Auto-approve scripts in TEST'
        required: false
        type: boolean
        default: true
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
    secrets:
      IONAPI_CONFIG:
        required: true
        description: 'Base64 encoded .ionapi file for TEST environment'

env:
  NODE_VERSION: ${{ inputs.node-version }}

jobs:
  deploy:
    name: Deploy to TEST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} -- '${{ inputs.components-path }}/' | tr '\n' ' ')
            echo "files=$FILES" >> $GITHUB_OUTPUT
            echo "is_pr=true" >> $GITHUB_OUTPUT
          else
            echo "files=" >> $GITHUB_OUTPUT
            echo "is_pr=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to TEST
        env:
          IONAPI_CONFIG: ${{ secrets.IONAPI_CONFIG }}
        run: |
          APPROVE_FLAG=""
          if [ "${{ inputs.auto-approve-scripts }}" == "true" ]; then
            APPROVE_FLAG="--auto-approve"
          fi

          TYPE_FLAG=""
          if [ -n "${{ inputs.component-types }}" ]; then
            TYPE_FLAG="--type ${{ inputs.component-types }}"
          fi

          npx ion-cicd --env tst deploy --ci $APPROVE_FLAG $TYPE_FLAG

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ **Deployed to TEST**\n\n- Run ID: ${{ github.run_id }}\n- Components: ${{ inputs.component-types || "changed files" }}'
            });

      - name: Summary
        if: always()
        run: |
          echo "## Deploy to TEST Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Component Types:** ${{ inputs.component-types || 'changed files' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Auto-approve Scripts:** ${{ inputs.auto-approve-scripts }}" >> $GITHUB_STEP_SUMMARY
