# Deploy to TEST Workflow
# Copy this file to your project's .github/workflows/ directory

name: Deploy to TEST

on:
  pull_request:
    branches: [Production]
    paths:
      - 'ion-components/**'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      component-types:
        description: 'Component types to deploy (comma-separated, or leave empty for changed files)'
        required: false
        type: string

jobs:
  deploy:
    uses: mikah/ion-cicd/.github/workflows/reusable/deploy-test.yml@v1
    with:
      component-types: ${{ inputs.component-types || '' }}
      # Optional: customize these
      # components-path: ion-components
      # auto-approve-scripts: true
    secrets:
      IONAPI_CONFIG: ${{ secrets.IONAPI_CONFIG_TST }}
